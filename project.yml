# Optional XcodeGen spec — the checked-in LiDirt.xcodeproj is authoritative.
# If you use XcodeGen: `xcodegen generate`
name: LiDirt
options:
  bundleIdPrefix: com.lidirt
  deploymentTarget:
    iOS: "17.0"
settings:
  SWIFT_VERSION: "5.0"
targets:
  LiDirt:
    type: application
    platform: iOS
    sources:
      - path: LiDirt
        excludes:
          - "**/*.md"
    settings:
      INFOPLIST_FILE: LiDirt/Resources/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.lidirt.app
      TARGETED_DEVICE_FAMILY: "1,2"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LiDirtTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LiDirtTests
    dependencies:
      - target: LiDirt
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.lidirt.app.tests
schemes:
  LiDirt:
    build:
      targets:
        LiDirt: all
        LiDirtTests: [test]
    test:
      targets:
        - LiDirtTests
